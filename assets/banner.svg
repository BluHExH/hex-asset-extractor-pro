<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A84FF;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0066CC;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#004C99;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.15" />
      <stop offset="50%" style="stop-color:#ffffff;stop-opacity:0.05" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.15" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg)"/>
  
  <!-- Subtle grid pattern -->
  <g opacity="0.08">
    <line x1="0" y1="50" x2="1200" y2="50" stroke="white" stroke-width="1"/>
    <line x1="0" y1="100" x2="1200" y2="100" stroke="white" stroke-width="1"/>
    <line x1="0" y1="150" x2="1200" y2="150" stroke="white" stroke-width="1"/>
    <line x1="0" y1="200" x2="1200" y2="200" stroke="white" stroke-width="1"/>
    <line x1="0" y1="250" x2="1200" y2="250" stroke="white" stroke-width="1"/>
    <line x1="0" y1="300" x2="1200" y2="300" stroke="white" stroke-width="1"/>
    <line x1="0" y1="350" x2="1200" y2="350" stroke="white" stroke-width="1"/>
    <line x1="100" y1="0" x2="100" y2="400" stroke="white" stroke-width="1"/>
    <line x1="200" y1="0" x2="200" y2="400" stroke="white" stroke-width="1"/>
    <line x1="300" y1="0" x2="300" y2="400" stroke="white" stroke-width="1"/>
    <line x1="400" y1="0" x2="400" y2="400" stroke="white" stroke-width="1"/>
    <line x1="500" y1="0" x2="500" y2="400" stroke="white" stroke-width="1"/>
    <line x1="600" y1="0" x2="600" y2="400" stroke="white" stroke-width="1"/>
    <line x1="700" y1="0" x2="700" y2="400" stroke="white" stroke-width="1"/>
    <line x1="800" y1="0" x2="800" y2="400" stroke="white" stroke-width="1"/>
    <line x1="900" y1="0" x2="900" y2="400" stroke="white" stroke-width="1"/>
    <line x1="1000" y1="0" x2="1000" y2="400" stroke="white" stroke-width="1"/>
    <line x1="1100" y1="0" x2="1100" y2="400" stroke="white" stroke-width="1"/>
  </g>
  
  <!-- Glow overlay -->
  <rect width="1200" height="400" fill="url(#glow)"/>
  
  <!-- Main logo circle -->
  <circle cx="200" cy="200" r="70" fill="white" opacity="0.15" filter="url(#shadow)"/>
  <circle cx="200" cy="200" r="55" fill="white" opacity="0.95" filter="url(#shadow)"/>
  
  <!-- HEX text inside logo -->
  <text x="200" y="215" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="bold" fill="#0A84FF" text-anchor="middle">HEX</text>
  
  <!-- Main title -->
  <text x="320" y="170" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="bold" fill="white" filter="url(#shadow)">HEX Asset Extractor Pro</text>
  
  <!-- Subtitle -->
  <text x="320" y="220" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#E0F0FF">Commercial-grade HTML Asset Intelligence</text>
  
  <!-- Tagline -->
  <text x="320" y="265" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#B8D4FF">Extract • Inspect • Export — 100% Client-Side</text>
  
  <!-- Bottom accent bar -->
  <rect x="0" y="380" width="1200" height="20" fill="#004C99" opacity="0.6"/>
  
  <!-- Decorative dots -->
  <circle cx="1050" cy="120" r="4" fill="white" opacity="0.4"/>
  <circle cx="1080" cy="150" r="3" fill="white" opacity="0.3"/>
  <circle cx="1120" cy="100" r="5" fill="white" opacity="0.25"/>
  <circle cx="1150" cy="180" r="3" fill="white" opacity="0.35"/>
  <circle cx="1000" cy="280" r="4" fill="white" opacity="0.3"/>
  <circle cx="1100" cy="300" r="3" fill="white" opacity="0.25"/>
</svg>