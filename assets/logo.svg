<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a73e8"/>
      <stop offset="50%" stop-color="#0d47a1"/>
      <stop offset="100%" stop-color="#0a2f6b"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="icon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64b5f6"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Main circle -->
  <circle cx="160" cy="160" r="145" fill="url(#bg)" filter="url(#shadow)"/>
  
  <!-- Shine overlay -->
  <circle cx="160" cy="160" r="145" fill="url(#shine)"/>
  
  <!-- Outer ring -->
  <circle cx="160" cy="160" r="132" fill="none" stroke="#64b5f6" stroke-width="2.5" opacity="0.4"/>
  
  <!-- Inner decorative ring -->
  <circle cx="160" cy="160" r="118" fill="none" stroke="white" stroke-width="1" opacity="0.15"/>

  <!-- Hexagon shape (representing HEX) -->
  <polygon points="160,75 210,105 210,165 160,195 110,165 110,105" fill="none" stroke="url(#icon)" stroke-width="4" opacity="0.9" filter="url(#glow)"/>
  
  <!-- Inner hexagon -->
  <polygon points="160,95 195,115 195,155 160,175 125,155 125,115" fill="none" stroke="white" stroke-width="2" opacity="0.5"/>

  <!-- Center icon - extraction symbol (layers) -->
  <rect x="140" y="125" width="40" height="8" rx="2" fill="white" opacity="0.95"/>
  <rect x="145" y="138" width="30" height="8" rx="2" fill="white" opacity="0.75"/>
  <rect x="150" y="151" width="20" height="8" rx="2" fill="white" opacity="0.55"/>

  <!-- Bottom text -->
  <text x="160" y="235" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="800" fill="white" text-anchor="middle" letter-spacing="3">HEX</text>
  <text x="160" y="258" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#90caf9" text-anchor="middle" letter-spacing="2.5">ASSET EXTRACTOR</text>
</svg>