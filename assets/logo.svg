<svg xmlns="http://www.w3.org/2000/svg" width="280" height="280" viewBox="0 0 280 280">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A84FF"/>
      <stop offset="100%" stop-color="#0055CC"/>
    </linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Background circle -->
  <circle cx="140" cy="140" r="130" fill="url(#g)" filter="url(#s)"/>
  <!-- Inner ring -->
  <circle cx="140" cy="140" r="108" fill="none" stroke="white" stroke-width="3" opacity="0.25"/>
  <!-- HEX text -->
  <text x="140" y="155" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="52" font-weight="900" fill="white" text-anchor="middle" letter-spacing="2">HEX</text>
  <!-- Small label -->
  <text x="140" y="190" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="white" text-anchor="middle" opacity="0.85" letter-spacing="3">ASSET EXTRACTOR</text>
</svg>